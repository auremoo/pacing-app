name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Les données des utilisateurs (coches, profil, pesées, plans importés) sont
    # lues et écrites par l'API GitHub, jamais via le site publié : les écrire ne
    # doit pas redéployer. Sinon chaque coche lançait un déploiement, et ces
    # déploiements s'embouteillaient (bloqués en « waiting », échecs sans tâche).
    # config.json, lui, est servi par le site : il redéploie toujours.
    paths-ignore:
      - 'state.json'
      - 'athlete.json'
      - 'body.json'
      - 'events/**'
      - 'routine/**'
      - 'users/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
